name: Build JavaPro APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          unzip -o "$ZIP"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          cd JavaPro
          gradle assembleDebug --no-daemon --stacktrace

      - name: Print SHA-1
        run: |
          find / -name "debug.keystore" 2>/dev/null | head -5
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null | grep SHA1 || \
          keytool -list -v \
            -keystore /root/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null | grep SHA1 || \
          echo "Keystore not found, generating..."
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android | grep SHA1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JavaPro-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
