name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: |
          unzip -q JavaPro.zip -d src
          cd src/JavaPro
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JavaPro-apk
          path: src/JavaPro/app/build/outputs/apk/debug/app-debug.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" src/JavaPro/app/build/outputs/apk/debug/app-debug.apk --title "JavaPro ${{ github.run_number }}" --notes "APK debug"
